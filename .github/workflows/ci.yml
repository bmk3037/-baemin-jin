name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    name: 비밀키 유출 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: 빌드 · 테스트 (자동 감지)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 어떤 언어로 만들지 아직 몰라서, 파일을 보고 알아서 판단해요.
      - name: 프로젝트 종류 감지
        id: detect
        run: |
          if [ -f package.json ]; then echo "node=true" >> "$GITHUB_OUTPUT"; fi
          if [ -f requirements.txt ] || [ -f pyproject.toml ]; then echo "python=true" >> "$GITHUB_OUTPUT"; fi

      # --- Node.js (package.json 이 있으면) ---
      - if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - if: steps.detect.outputs.node == 'true'
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - if: steps.detect.outputs.node == 'true'
        run: npm run lint --if-present
      - if: steps.detect.outputs.node == 'true'
        run: npm run test --if-present
      - if: steps.detect.outputs.node == 'true'
        run: npm run build --if-present

      # --- Python (requirements.txt / pyproject.toml 이 있으면) ---
      - if: steps.detect.outputs.python == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.detect.outputs.python == 'true'
        run: |
          python -m pip install --upgrade pip pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - if: steps.detect.outputs.python == 'true'
        name: pytest
        # 테스트가 하나도 없을 때(exit 5)는 실패로 치지 않아요.
        run: pytest || [ $? -eq 5 ]

      - if: steps.detect.outputs.node != 'true' && steps.detect.outputs.python != 'true'
        run: echo "::notice::아직 코드가 없어서 빌드·테스트는 건너뛰었어요. package.json 이나 requirements.txt 를 추가하면 자동으로 돌아요."
